<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Ink Button — let's collaborate</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="viewport">
    <section id="stage-card" class="stage-card use-custom-cursor" aria-label="Interactive sticky ink button stage">
      <!-- Layer 2: Custom white/black hand pointer cursor (underneath ink so black slime coats the hand) -->
      <div id="custom-cursor" class="custom-cursor" aria-hidden="true" hidden>
        <svg viewBox="0 0 32 36" width="32" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11.2 2.2C9.8 2.2 8.7 3.3 8.7 4.7V16.6L6.4 14.3C5.3 13.2 3.5 13.2 2.4 14.3C1.4 15.3 1.4 17.0 2.4 18.1L8.9 25.8C10.5 27.7 12.9 28.8 15.4 28.8H21.2C25.2 28.8 28.2 25.6 28.2 21.4V14.2C28.2 12.8 27.1 11.7 25.7 11.7C25.1 11.7 24.5 11.9 24.1 12.3C23.8 11.1 22.8 10.3 21.5 10.3C20.8 10.3 20.2 10.5 19.7 11.0C19.4 9.8 18.3 9.0 17.1 9.0C16.2 9.0 15.4 9.4 14.9 10.1V4.7C14.9 3.3 13.8 2.2 12.4 2.2H11.2Z"
            fill="#FFFFFF"
            stroke="#111114"
            stroke-width="2.1"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <line x1="15" y1="14.5" x2="15" y2="21.5" stroke="#111114" stroke-width="1.6" stroke-linecap="round" />
          <line x1="19.5" y1="14.8" x2="19.5" y2="21.5" stroke="#111114" stroke-width="1.6" stroke-linecap="round" />
          <line x1="23.8" y1="15.5" x2="23.8" y2="21.5" stroke="#111114" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </div>

      <!-- Layer 3: WebGL2 dual-scale height-field 3D glossy ink canvas -->
      <canvas id="ink-canvas" aria-hidden="true"></canvas>

      <!-- Layer 4: Real semantic pill button keeping crisp static text -->
      <button id="collab-btn" class="collab-btn" type="button">
        <span class="collab-btn__label">let's collaborate</span>
      </button>

      <!-- Layer 5: Minimal collapsible micro-tuning dock -->
      <div id="tune-dock" class="tune-dock">
        <button
          id="tune-toggle"
          class="tune-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="tune-panel"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M2.5 4.5H13.5M2.5 8H13.5M2.5 11.5H13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="5.5" cy="4.5" r="1.5" fill="#f4f4f6" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="10.5" cy="8" r="1.5" fill="#f4f4f6" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="6.5" cy="11.5" r="1.5" fill="#f4f4f6" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>Tune</span>
        </button>

        <aside id="tune-panel" class="tune-panel" hidden aria-label="Ink physics and surface tuning">
          <div class="tune-panel__header">
            <span class="tune-panel__title">Ink Tuning</span>
            <button id="tune-reset" class="tune-reset" type="button">Reset</button>
          </div>

          <label class="tune-row" for="ctrl-strands">
            <span class="tune-row__meta">
              <span>Strands</span>
              <output id="val-strands" for="ctrl-strands">7</output>
            </span>
            <input id="ctrl-strands" type="range" min="4" max="11" step="1" value="7">
          </label>

          <label class="tune-row" for="ctrl-stretch">
            <span class="tune-row__meta">
              <span>Stretch Limit</span>
              <output id="val-stretch" for="ctrl-stretch">175 px</output>
            </span>
            <input id="ctrl-stretch" type="range" min="115" max="240" step="5" value="175">
          </label>

          <label class="tune-row" for="ctrl-elasticity">
            <span class="tune-row__meta">
              <span>Elasticity</span>
              <output id="val-elasticity" for="ctrl-elasticity">1.00</output>
            </span>
            <input id="ctrl-elasticity" type="range" min="0.50" max="1.80" step="0.05" value="1.00">
          </label>

          <label class="tune-row" for="ctrl-glossiness">
            <span class="tune-row__meta">
              <span>Glossiness</span>
              <output id="val-glossiness" for="ctrl-glossiness">1.00</output>
            </span>
            <input id="ctrl-glossiness" type="range" min="0.40" max="1.60" step="0.05" value="1.00">
          </label>

          <label class="tune-check" for="ctrl-cursor">
            <input id="ctrl-cursor" type="checkbox" checked>
            <span>Sticky Hand Cursor</span>
          </label>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
